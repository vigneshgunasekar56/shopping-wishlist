<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wishlist Locker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <h1>Wishlist Locker</h1>
      <section id="totals"></section>

      <form id="add-form" class="panel">
         <h2 id="form-title">Add an item</h2>
        <input type="text" id="name-input" placeholder="Item Name" required />
        <input type="number" id="price-input" placeholder="Price" min="0" step="0.01" />
        <div class="form-buttons button">
          <button type="submit" id="submit-button">Add to list</button>
          <button id="cancel-button" class="hidden">Cancel</button>
        </div>
      </form>
      <section id="item-list" class="item-list"></section>
    </main>

    <script src="app.js" type="module"></script>
  </body>
</html>
